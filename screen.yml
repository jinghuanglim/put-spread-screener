name: screen

# No schedule. This runs when you upload a new pcs_screen.py, or when you press
# "Run workflow" on this tab. The page itself has no button — a run rebuilds
# and republishes the site, which is a deployment, and only you can deploy.
on:
  workflow_dispatch:
  # Uploading a new pcs_screen.py IS the deploy. Pushing it rebuilds and
  # republishes the page, so nobody has to press anything afterwards - and
  # nobody but you can trigger it, because nobody else can push.
  push:
    paths:
      - 'pcs_screen.py'
      - '.github/workflows/screen.yml'

permissions:
  contents: write           # commits the log and the page back

concurrency:
  group: screen
  cancel-in-progress: false # never let a second press clobber a run mid-commit

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet yfinance requests

      - name: Selftest
        # A broken build must never publish. Runs offline, ~1 second.
        run: python pcs_screen.py --selftest

      - name: Run screen
        env:
          BLS_CONTACT_EMAIL: ${{ secrets.BLS_CONTACT_EMAIL }}
          DISPATCH_URL: ${{ vars.DISPATCH_URL }}
        # Yahoo rate-limits cloud IPs and GitHub runners are Azure. Three
        # attempts with a real gap; if all three fail the script exits 2 on data
        # loss and the job goes red rather than publishing an empty screen that
        # reads like a quiet market.
        run: |
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if python pcs_screen.py --quiet --html docs/index.html
            then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            # `[ ... ] && sleep` would abort the step on the last pass, because
            # GitHub runs `run:` blocks under `bash -e`. An explicit `if` keeps
            # the loop's exit path readable.
            if [ "$attempt" -lt 3 ]; then sleep 90; fi
          done
          echo "::error::all three attempts failed - not publishing"
          exit 1

      # A red build used to be invisible to anyone on the page: nothing new
      # published, so the status line waited out five minutes and then shrugged
      # at you. Writing the outcome to the same tiny file the page already
      # polls turns that into "Run #25 failed" within seconds. This step does
      # not rescue the job - it stays red - it only makes the failure legible
      # to someone who is not watching the Actions tab.
      - name: Publish the failure
        if: failure()
        run: |
          mkdir -p docs
          printf '{"run":"%s","utc":"%s","state":"failed"}\n' \
            "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" > docs/version.json
          git config user.name  "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/version.json
          git diff --staged --quiet && echo "already marked" && exit 0
          git commit -m "run $GITHUB_RUN_NUMBER failed"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash || exit 1
          done
          exit 1

      - name: Commit
        run: |
          git config user.name  "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          # Only the page. No run log, no dated archive: this is a live
          # screening tool, not a record. Anyone with the link can press the
          # button, so anything this step accumulated would be a pile of other
          # people's presses rather than a history of anything.
          git add docs
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "screen $(date -u +%F\ %H:%M)"
          # The push races anyone who commits while a run is in flight — you
          # pushing from your laptop, or a second run finishing first. The
          # checkout is then stale and the push is rejected, which used to kill
          # the job AFTER the screen had already succeeded: work done, nothing
          # published. Rebase onto whatever landed and try again. The logs are
          # append-only and nobody else edits them by hand, so replaying on top
          # is the correct resolution rather than a merge.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected - rebasing onto the remote and retrying"
            git pull --rebase --autostash || {
              echo "::error::rebase failed - resolve by hand"
              exit 1
            }
          done
          echo "::error::could not push after 3 attempts"
          exit 1